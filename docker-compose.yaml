volumes:
  pg_data_production:
  static:
  media:

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    ports:
      - 5555:5432
  backend:
    build: ./backend/
    env_file: .env
    volumes:
      - static:/staticfiles
      - media:/app/media
      - ./backend:/app
    depends_on:
      - postgres
  aup_3d:
    env_file: .env
    build: ./AUP_3D/
    # command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/app
      - media:/media

  gateway:
    build: ./nginx/
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - static:/staticfiles
      - media:/media
      - ./AUP_3D:/staticfiles
    depends_on:
      - backend
      - aup_3d