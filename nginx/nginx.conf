server {
  
  listen 80;
  index index.html index.htm;
  server_tokens off;
  
  location /admin {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # location /static/admin/ {
  #   proxy_pass http://backend:8000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  location /s/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://backend:8000/s/;
  }
  location /api/sprinkler/ {
    client_max_body_size 20M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://backend:8000/api/sprinkler/;
  }
  location /api/sole/ {
    client_max_body_size 20M;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://backend:8000/api/sole/;
  }

location /api/tubes/types/ {
    proxy_pass https://projects.sa-biysk.ru/api/tubes/types/;
    proxy_set_header Host projects.sa-biysk.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

location /api/tubes/list/ {
    proxy_pass https://projects.sa-biysk.ru/api/tubes/list/;
    proxy_set_header Host projects.sa-biysk.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}
  # Admin Django


  # Media файлы
  location /media/ {
    alias /media/;
    expires 30d;
  }
  location /static/ {
    alias /staticfiles/;
    try_files $uri $uri/ /index.html =404;
  }

  location / {
    alias /staticfiles/;
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }

}